<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #202124; }
    .layout { display: grid; grid-template-columns: 220px 320px 1fr; height: 100vh; }
    .pane { overflow-y: auto; border-right: 1px solid #e0e0e0; }
    .pane:last-child { border-right: none; }
    #detailPane { display: flex; flex-direction: column; overflow: hidden; }
    .pane-header { padding: 12px 14px; font-weight: bold; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: #fff; }
    .list-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f1f1f1; }
    .list-item:hover { background: #f5f5f5; }
    .list-item.active { background: #e8f0fe; }
    .list-item .title { font-weight: 600; }
    .list-item .subtitle { color: #5f6368; font-size: 12px; margin-top: 2px; }
    .empty { padding: 16px; color: #5f6368; }
    .detail-header { padding: 12px 16px; border-bottom: 1px solid #e0e0e0; }
    .detail-header h2 { margin: 0 0 4px; font-size: 16px; }
    .detail-header .meta { color: #5f6368; font-size: 12px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; }
    .message { max-width: 70%; margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; }
    .message.INBOUND { background: #fff; border: 1px solid #e0e0e0; margin-right: auto; }
    .message.OUTBOUND { background: #d9fdd3; margin-left: auto; }
    .message.FAILED { background: #fce8e6; border: 1px solid #f28b82; }
    .message .text { white-space: pre-wrap; }
    .message .time { color: #5f6368; font-size: 11px; margin-top: 4px; }
    .compose { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e0e0e0; }
    .compose textarea { flex: 1; resize: none; padding: 8px; font-family: inherit; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .compose button { padding: 0 18px; border: none; border-radius: 4px; background: #1a73e8; color: #fff; cursor: pointer; }
    .compose button:disabled { background: #9aa0a6; cursor: default; }
    .compose-error { color: #d93025; font-size: 12px; padding: 0 16px 8px; }
    .compose select { max-width: 140px; padding: 0 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .stage-select { margin-top: 6px; padding: 4px 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .remarks { background: #fff8e1; border-bottom: 1px solid #e0e0e0; padding: 10px 16px; }
    .remarks-title { font-weight: 600; font-size: 12px; color: #5f6368; margin-bottom: 6px; }
    .remark { font-size: 13px; margin-bottom: 6px; }
    .remark .remark-meta { color: #5f6368; font-size: 11px; }
    .remark-add { display: flex; gap: 6px; margin-top: 6px; }
    .remark-add input { flex: 1; padding: 5px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .remark-add button { padding: 0 12px; border: none; border-radius: 4px; background: #5f6368; color: #fff; cursor: pointer; font-size: 12px; }
    .reminders { background: #e8f0fe; border-bottom: 1px solid #e0e0e0; padding: 10px 16px; }
    .reminder { font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .reminder .reminder-due { color: #5f6368; font-size: 11px; }
    .reminder button { border: none; background: none; color: #1a73e8; cursor: pointer; font-size: 11px; padding: 0; }
    .reminder-add { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .reminder-add input[type="text"] { flex: 1; min-width: 120px; padding: 5px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .reminder-add input[type="datetime-local"] { padding: 4px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .reminder-add button { padding: 0 12px; border: none; border-radius: 4px; background: #1a73e8; color: #fff; cursor: pointer; font-size: 12px; }
    .snooze-btn { margin-top: 6px; margin-left: 8px; padding: 4px 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .snooze-banner { background: #fef7e0; padding: 6px 16px; font-size: 12px; color: #7a5900; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="pane" id="numbersPane">
      <div class="pane-header">Numbers</div>
      <div id="numbersList"><div class="empty">Loading…</div></div>
    </div>
    <div class="pane" id="conversationsPane">
      <div class="pane-header">Conversations</div>
      <div id="conversationsList"><div class="empty">Select a number</div></div>
    </div>
    <div class="pane" id="detailPane">
      <div id="detailContent"><div class="empty">Select a conversation</div></div>
    </div>
  </div>

  <script>
    var selectedNumberId = null;
    var selectedConversationId = null;
    var selectedCustomerId = null;
    var cachedStages = null;

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function loadNumbers() {
      google.script.run.withSuccessHandler(renderNumbers).withFailureHandler(renderError('numbersList')).listMyNumbers();
    }

    function renderNumbers(numbers) {
      var container = document.getElementById('numbersList');
      if (!numbers.length) { container.innerHTML = '<div class="empty">No numbers assigned</div>'; return; }
      container.innerHTML = numbers.map(function (number) {
        return '<div class="list-item" data-id="' + escapeHtml(number.id) + '" onclick="selectNumber(\'' + number.id + '\')">' +
          '<div class="title">' + escapeHtml(number.displayName) + '</div>' +
          '<div class="subtitle">' + escapeHtml(number.phoneNumber) + '</div></div>';
      }).join('');
    }

    function selectNumber(numberId) {
      selectedNumberId = numberId;
      selectedConversationId = null;
      document.querySelectorAll('#numbersList .list-item').forEach(function (el) { el.classList.toggle('active', el.dataset.id === numberId); });
      loadConversations();
      document.getElementById('detailContent').innerHTML = '<div class="empty">Select a conversation</div>';
    }

    function loadConversations() {
      document.getElementById('conversationsList').innerHTML = '<div class="empty">Loading…</div>';
      google.script.run.withSuccessHandler(renderConversations).withFailureHandler(renderError('conversationsList')).listConversations(selectedNumberId);
    }

    function renderConversations(conversations) {
      var container = document.getElementById('conversationsList');
      if (!conversations.length) { container.innerHTML = '<div class="empty">No conversations</div>'; return; }
      container.innerHTML = conversations.map(function (conversation) {
        return '<div class="list-item" data-id="' + escapeHtml(conversation.id) + '" onclick="selectConversation(\'' + conversation.id + '\')">' +
          '<div class="title">' + escapeHtml(conversation.status) + (conversation.needsResponse ? ' • Needs response' : '') + '</div>' +
          '<div class="subtitle">' + escapeHtml(conversation.lastMessageAt || '') + '</div></div>';
      }).join('');
      if (selectedConversationId) {
        var el = container.querySelector('[data-id="' + selectedConversationId + '"]');
        if (el) el.classList.add('active');
      }
    }

    function selectConversation(conversationId) {
      selectedConversationId = conversationId;
      document.querySelectorAll('#conversationsList .list-item').forEach(function (el) { el.classList.toggle('active', el.dataset.id === conversationId); });
      document.getElementById('detailContent').innerHTML = '<div class="empty">Loading…</div>';
      loadDetail();
    }

    function loadDetail() {
      google.script.run.withSuccessHandler(renderDetail).withFailureHandler(renderError('detailContent')).getConversationDetail(selectedConversationId);
    }

    function renderDetail(detail) {
      selectedCustomerId = detail.customer && detail.customer.id;
      var customerName = (detail.customer && detail.customer.name) || (detail.customer && detail.customer.phone) || 'Unknown customer';
      var messagesHtml = detail.messages.map(function (message) {
        return '<div class="message ' + escapeHtml(message.direction) + ' ' + escapeHtml(message.status === 'FAILED' ? 'FAILED' : '') + '">' +
          '<div class="text">' + escapeHtml(message.messageText) + '</div>' +
          '<div class="time">' + escapeHtml(message.timestamp) + (message.status === 'FAILED' ? ' • Failed to send' : '') + '</div></div>';
      }).join('');

      document.getElementById('detailContent').innerHTML =
        '<div class="detail-header"><h2>' + escapeHtml(customerName) + '</h2>' +
        '<div class="meta">' + escapeHtml(detail.customer && detail.customer.phone) + ' • ' + escapeHtml(detail.number && detail.number.displayName) +
        ' • Assigned: ' + escapeHtml(detail.conversation.assignedUserId || 'Unassigned') +
        ' • Status: ' + escapeHtml(detail.conversation.status) + '</div>' +
        '<select class="stage-select" id="stageSelect" onchange="changeStage()"><option value="">Stage: (loading…)</option></select>' +
        '<button class="snooze-btn" id="snoozeBtn" onclick="toggleSnooze()">Snooze…</button>' +
        '</div>' +
        '<div id="snoozeBanner"></div>' +
        '<div class="remarks" id="remarksPane"><div class="remarks-title">Internal remarks (never sent to WhatsApp)</div><div class="empty">Loading…</div></div>' +
        '<div class="reminders" id="remindersPane"><div class="remarks-title">Reminders</div><div class="empty">Loading…</div></div>' +
        '<div class="messages" id="messagesList">' + (messagesHtml || '<div class="empty">No messages yet</div>') + '</div>' +
        '<div class="compose-error" id="composeError"></div>' +
        '<div class="compose">' +
        '<textarea id="composeText" rows="2" placeholder="Type a reply…"></textarea>' +
        '<select id="quickReplySelect" onchange="insertQuickReply()"><option value="">Quick reply…</option></select>' +
        '<button id="composeSend" onclick="sendCurrentReply()">Send</button>' +
        '<select id="templateSelect"><option value="">Template…</option></select>' +
        '<button id="templateSend" onclick="sendCurrentTemplate()">Send Template</button>' +
        '<button id="mediaSend" onclick="sendCurrentMedia()">Media…</button>' +
        '</div>';

      var messagesList = document.getElementById('messagesList');
      messagesList.scrollTop = messagesList.scrollHeight;

      loadStageControl();
      loadRemarks();
      loadReminders();
      loadSnoozeStatus();
      loadTemplateSelect();
      loadQuickReplySelect();
    }

    function loadQuickReplySelect() {
      google.script.run.withSuccessHandler(function (quickReplies) {
        var select = document.getElementById('quickReplySelect');
        if (!select) return;
        select.innerHTML = '<option value="">Quick reply…</option>' +
          quickReplies.map(function (q) { return '<option value="' + escapeHtml(q.id) + '">' + escapeHtml(q.shortcut) + '</option>'; }).join('');
        select.dataset.quickReplies = JSON.stringify(quickReplies);
      }).withFailureHandler(function () {}).listQuickReplies();
    }

    function insertQuickReply() {
      var select = document.getElementById('quickReplySelect');
      if (!select.value) return;
      var quickReplies = JSON.parse(select.dataset.quickReplies || '[]');
      var quickReply = quickReplies.filter(function (q) { return q.id === select.value; })[0];
      if (quickReply) {
        var textarea = document.getElementById('composeText');
        textarea.value = (textarea.value ? textarea.value + ' ' : '') + quickReply.text;
        textarea.focus();
      }
      select.value = '';
    }

    function sendCurrentMedia() {
      var mediaType = prompt('Media type (image, document, video, audio):', 'image');
      if (!mediaType) return;
      var mediaUrl = prompt('Media URL:');
      if (!mediaUrl) return;
      var caption = prompt('Caption (optional):', '') || '';
      var button = document.getElementById('mediaSend');
      button.disabled = true;
      google.script.run
        .withSuccessHandler(function () { button.disabled = false; loadDetail(); loadConversations(); })
        .withFailureHandler(function (error) { button.disabled = false; alert('Could not send media: ' + (error && error.message)); })
        .sendMediaReply(selectedConversationId, mediaType, mediaUrl, caption);
    }

    function loadTemplateSelect() {
      google.script.run.withSuccessHandler(function (templates) {
        var select = document.getElementById('templateSelect');
        if (!select) return;
        var approved = templates.filter(function (t) { return t.status === 'APPROVED'; });
        select.innerHTML = '<option value="">Template… (' + approved.length + ' approved)</option>' +
          approved.map(function (t) { return '<option value="' + escapeHtml(t.id) + '">' + escapeHtml(t.name) + '</option>'; }).join('');
        select.dataset.templates = JSON.stringify(approved);
      }).withFailureHandler(function () {}).listTemplates();
    }

    function sendCurrentTemplate() {
      var select = document.getElementById('templateSelect');
      if (!select.value) return;
      var templates = JSON.parse(select.dataset.templates || '[]');
      var template = templates.filter(function (t) { return t.id === select.value; })[0];
      var body = template && template.components && template.components.filter(function (c) { return c.type === 'BODY'; })[0];
      var placeholders = body ? (body.text.match(/\{\{\d+\}\}/g) || []) : [];
      var variables = {};
      for (var i = 0; i < placeholders.length; i++) {
        var index = placeholders[i].replace(/\D/g, '');
        var value = prompt('Value for ' + placeholders[i] + ' in "' + template.name + '":');
        if (value === null) return; // cancelled
        variables[index] = value;
      }
      var button = document.getElementById('templateSend');
      button.disabled = true;
      google.script.run
        .withSuccessHandler(function () { button.disabled = false; loadDetail(); loadConversations(); })
        .withFailureHandler(function (error) { button.disabled = false; alert('Could not send template: ' + (error && error.message)); })
        .sendTemplateReply(selectedConversationId, template.id, variables);
    }

    function loadSnoozeStatus() {
      google.script.run.withSuccessHandler(renderSnoozeStatus).withFailureHandler(function () {}).getSnoozeStatus(selectedConversationId);
    }

    function renderSnoozeStatus(status) {
      var banner = document.getElementById('snoozeBanner');
      var btn = document.getElementById('snoozeBtn');
      if (!banner || !btn) return;
      if (status && status.snoozed) {
        banner.innerHTML = '<div class="snooze-banner">Snoozed until ' + escapeHtml(status.snoozedUntil) + '</div>';
        btn.textContent = 'Un-snooze';
      } else {
        banner.innerHTML = '';
        btn.textContent = 'Snooze…';
      }
    }

    function toggleSnooze() {
      google.script.run.withSuccessHandler(function (status) {
        if (status && status.snoozed) { loadSnoozeStatus(); return; }
        // Currently not snoozed (or was just un-snoozed) — ask how long to snooze for.
        var hours = prompt('Snooze this conversation for how many hours?', '4');
        if (!hours) return;
        var until = new Date(Date.now() + Number(hours) * 3600000).toISOString();
        google.script.run.withSuccessHandler(function () { loadSnoozeStatus(); loadConversations(); })
          .withFailureHandler(function (error) { alert('Could not snooze: ' + (error && error.message)); })
          .snoozeConversation(selectedConversationId, until);
      }).withFailureHandler(function () {}).getSnoozeStatus(selectedConversationId);
    }

    function loadReminders() {
      google.script.run.withSuccessHandler(renderReminders).withFailureHandler(function () {
        var pane = document.getElementById('remindersPane');
        if (pane) pane.style.display = 'none';
      }).listReminders(selectedConversationId);
    }

    function renderReminders(reminders) {
      var pane = document.getElementById('remindersPane');
      if (!pane) return;
      var pending = reminders.filter(function (r) { return r.status === 'PENDING'; });
      var listHtml = pending.map(function (reminder) {
        return '<div class="reminder"><span>' + escapeHtml(reminder.text) + '<div class="reminder-due">Due ' + escapeHtml(reminder.dueAt) + '</div></span>' +
          '<button onclick="completeReminder(\'' + reminder.id + '\')">Done</button></div>';
      }).join('') || '<div class="empty">No pending reminders</div>';
      pane.innerHTML = '<div class="remarks-title">Reminders</div>' + listHtml +
        '<div class="reminder-add"><input type="text" id="reminderText" placeholder="Reminder text…">' +
        '<input type="datetime-local" id="reminderDue">' +
        '<button onclick="addCurrentReminder()">Add</button></div>';
    }

    function addCurrentReminder() {
      var textInput = document.getElementById('reminderText');
      var dueInput = document.getElementById('reminderDue');
      var text = textInput.value.trim();
      if (!text || !dueInput.value) return;
      var dueAt = new Date(dueInput.value).toISOString();
      google.script.run.withSuccessHandler(function () { textInput.value = ''; dueInput.value = ''; loadReminders(); })
        .withFailureHandler(function (error) { alert('Could not add reminder: ' + (error && error.message)); })
        .createReminder(selectedConversationId, text, dueAt);
    }

    function completeReminder(reminderId) {
      google.script.run.withSuccessHandler(loadReminders).withFailureHandler(function (error) { alert('Could not update reminder: ' + (error && error.message)); })
        .updateReminderStatus(reminderId, 'COMPLETED');
    }

    function loadStageControl() {
      if (cachedStages) { populateStageSelect(); return; }
      google.script.run.withSuccessHandler(function (stages) { cachedStages = stages; populateStageSelect(); }).withFailureHandler(function () {}).listStages();
    }

    function populateStageSelect() {
      var select = document.getElementById('stageSelect');
      if (!select) return;
      google.script.run.withSuccessHandler(function (current) {
        var currentStageId = current && current.stageId;
        select.innerHTML = '<option value="">Stage: (none)</option>' + cachedStages.map(function (stage) {
          return '<option value="' + escapeHtml(stage.id) + '"' + (stage.id === currentStageId ? ' selected' : '') + '>Stage: ' + escapeHtml(stage.name) + '</option>';
        }).join('');
      }).withFailureHandler(function () {}).getCustomerStage(selectedCustomerId);
    }

    function changeStage() {
      var select = document.getElementById('stageSelect');
      if (!select.value) return;
      google.script.run.withFailureHandler(function (error) { alert('Could not change stage: ' + (error && error.message)); }).setCustomerStage(selectedCustomerId, select.value);
    }

    function loadRemarks() {
      google.script.run.withSuccessHandler(renderRemarks).withFailureHandler(function () {
        var pane = document.getElementById('remarksPane');
        if (pane) pane.style.display = 'none'; // e.g. VIEWER has no remarks access — hide rather than show an error here
      }).listRemarks(selectedConversationId);
    }

    function renderRemarks(remarks) {
      var pane = document.getElementById('remarksPane');
      if (!pane) return;
      var listHtml = remarks.map(function (remark) {
        return '<div class="remark">' + escapeHtml(remark.text) + '<div class="remark-meta">' + escapeHtml(remark.createdAt) + '</div></div>';
      }).join('') || '<div class="empty">No remarks yet</div>';
      pane.innerHTML = '<div class="remarks-title">Internal remarks (never sent to WhatsApp)</div>' + listHtml +
        '<div class="remark-add"><input id="remarkText" placeholder="Add a remark…" onkeydown="if(event.key===\'Enter\')addCurrentRemark();">' +
        '<button onclick="addCurrentRemark()">Add</button></div>';
    }

    function addCurrentRemark() {
      var input = document.getElementById('remarkText');
      var text = input.value.trim();
      if (!text) return;
      google.script.run.withSuccessHandler(function () { input.value = ''; loadRemarks(); })
        .withFailureHandler(function (error) { alert('Could not add remark: ' + (error && error.message)); })
        .addRemark(selectedConversationId, text);
    }

    function sendCurrentReply() {
      var textarea = document.getElementById('composeText');
      var button = document.getElementById('composeSend');
      var errorBox = document.getElementById('composeError');
      var text = textarea.value.trim();
      if (!text) return;
      button.disabled = true;
      errorBox.textContent = '';
      google.script.run
        .withSuccessHandler(function () {
          textarea.value = '';
          button.disabled = false;
          loadDetail();
          loadConversations();
        })
        .withFailureHandler(function (error) {
          button.disabled = false;
          errorBox.textContent = 'Could not send: ' + (error && error.message);
        })
        .sendReply(selectedConversationId, text);
    }

    function renderError(elementId) {
      return function (error) {
        document.getElementById(elementId).innerHTML = '<div class="empty">Error: ' + escapeHtml(error && error.message) + '</div>';
      };
    }

    loadNumbers();
  </script>
</body>
</html>
