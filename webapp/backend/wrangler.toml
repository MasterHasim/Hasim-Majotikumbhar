name = "whatsapp-panel-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Free tier (Workers Free plan): 100,000 requests/day, no credit card required.
# Secrets (Firebase service account, Exotel credentials, webhook token) are set
# via `wrangler secret put <NAME>` — never committed here. See .dev.vars.example
# for the full list needed and README.md for the one-time setup steps.

[vars]
FIREBASE_DATABASE_URL = "https://whatsapp-panel-db-default-rtdb.asia-southeast1.firebasedatabase.app"
ENVIRONMENT = "development"
# Frontend origins allowed to call this API — see lib/cors.ts. Keep localhost:5173 so the
# dev server keeps working alongside the hosted frontend.
ALLOWED_ORIGINS = "http://localhost:5173,https://whatsapp-panel-frontend.hasim-c9e.workers.dev"

# New-user onboarding email (lib/email.ts) — RESEND_API_KEY is a secret (`wrangler secret put
# RESEND_API_KEY`), not set here. RESEND_FROM_EMAIL's domain must be verified in the Resend
# dashboard first, or every send will fail. Until the API key secret is set, createUser simply
# skips sending (never blocks user creation) and the manual "Send welcome email" button in
# Admin -> Users shows a clear CONFIGURATION_ERROR instead of silently doing nothing.
RESEND_FROM_EMAIL = "ECHT Connect <notifications@updates.echt.co.in>"
FRONTEND_URL = "https://whatsapp-panel-frontend.hasim-c9e.workers.dev"

# R2 free tier: 10 GB storage, 1M Class A + 10M Class B operations/month, no
# credit card required. Hosts agent-uploaded media (Phase 6/11's
# uploadConversationMedia) — the free-tier equivalent of the Apps Script
# build's Drive-backed upload, since Workers has no local/persistent disk.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "whatsapp-panel-media"

# Firebase RTDB -> D1 migration (see the migration plan / PROGRESS.md). This is the STAGING
# database — used for backfill/parity-script testing (Phase 3 of the rollout) before any real
# production data ever touches D1. A separate production D1 database + binding gets added only
# once staging validates cleanly (decision: staging first, per the approved migration plan).
# Binding this alone changes nothing: every collection defaults to 'firebase' mode unless
# explicitly listed in the DATA_BACKEND_MODES var, which is deliberately unset here.
[[d1_databases]]
binding = "DB"
database_name = "whatsapp-panel-db-staging"
database_id = "e2ba6025-625c-4496-b09b-8702afa6f99e"
