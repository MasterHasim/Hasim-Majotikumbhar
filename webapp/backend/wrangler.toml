name = "whatsapp-panel-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Free tier (Workers Free plan): 100,000 requests/day, no credit card required.
# Secrets (Firebase service account, Exotel credentials, webhook token) are set
# via `wrangler secret put <NAME>` — never committed here. See .dev.vars.example
# for the full list needed and README.md for the one-time setup steps.

[vars]
FIREBASE_DATABASE_URL = "https://whatsapp-panel-db-default-rtdb.asia-southeast1.firebasedatabase.app"
ENVIRONMENT = "development"
# Frontend origins allowed to call this API — see lib/cors.ts. Keep localhost:5173 so the
# dev server keeps working alongside the hosted frontend.
ALLOWED_ORIGINS = "http://localhost:5173,https://whatsapp-panel-frontend.hasim-c9e.workers.dev"

# New-user onboarding email (lib/email.ts) — RESEND_API_KEY is a secret (`wrangler secret put
# RESEND_API_KEY`), not set here. RESEND_FROM_EMAIL's domain must be verified in the Resend
# dashboard first, or every send will fail. Until the API key secret is set, createUser simply
# skips sending (never blocks user creation) and the manual "Send welcome email" button in
# Admin -> Users shows a clear CONFIGURATION_ERROR instead of silently doing nothing.
RESEND_FROM_EMAIL = "ECHT Connect <notifications@updates.echt.co.in>"
FRONTEND_URL = "https://whatsapp-panel-frontend.hasim-c9e.workers.dev"

# First staged cutover of the Firebase RTDB -> D1 migration (see the migration plan /
# PROGRESS.md, Phase 4): the two lowest-risk collections — barely written, no PII/money on the
# line — go to 'dual' mode now (write both Firebase and D1, read from Firebase). A 1-week
# validation window with verifyD1Parity runs before either is flipped to pure 'd1' mode, per the
# approved plan. Everything else stays 'firebase' (unlisted = default) until its own turn. Must
# live in [vars] -- it was briefly misplaced right after a [[d1_databases]] table, where TOML
# silently attached it to that table instead (wrangler's own "unexpected field" deploy warning
# is what caught it), so it never actually took effect on that one deploy.
DATA_BACKEND_MODES = "{\"adAccounts\":\"dual\",\"quickReplies\":\"dual\"}"

# R2 free tier: 10 GB storage, 1M Class A + 10M Class B operations/month, no
# credit card required. Hosts agent-uploaded media (Phase 6/11's
# uploadConversationMedia) — the free-tier equivalent of the Apps Script
# build's Drive-backed upload, since Workers has no local/persistent disk.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "whatsapp-panel-media"

# Firebase RTDB -> D1 migration (see the migration plan / PROGRESS.md). Phase 1 (foundations,
# schema, AppDb) and Phase 3 (backfill/parity scripts, sanity-checked against real SQL) were
# validated against a staging database first, per the approved plan's "staging first" decision.
# This is now the PRODUCTION database — Phase 4 of the rollout: staged per-collection cutover,
# starting with low-risk collections (see DATA_BACKEND_MODES below). Binding this alone changes
# nothing on its own: every collection still defaults to 'firebase' unless explicitly listed in
# DATA_BACKEND_MODES.
[[d1_databases]]
binding = "DB"
database_name = "whatsapp-panel-db"
database_id = "1bffae02-c796-4433-8be4-78e97b0d3e1d"

# Staging database, kept bound under a second name for any future backfill/parity dry-runs
# before a NEW collection's first cutover — not used by anything at runtime today.
[[d1_databases]]
binding = "STAGING_DB"
database_name = "whatsapp-panel-db-staging"
database_id = "e2ba6025-625c-4496-b09b-8702afa6f99e"

# Create these queues before deployment (`wrangler queues create ...`). Customer records are
# first committed to Firebase RTDB, then their ids are delivered to this consumer for Zoho sync.
[[queues.producers]]
binding = "ZOHO_CUSTOMER_SYNC_QUEUE"
queue = "whatsapp-panel-zoho-customer-sync"

[[queues.consumers]]
queue = "whatsapp-panel-zoho-customer-sync"
max_batch_size = 10
max_retries = 8
dead_letter_queue = "whatsapp-panel-zoho-customer-sync-dlq"

# Free-tier edge cache (KV free tier: 100k reads/day, 1k writes/day, 1GB storage) for a small,
# deliberately narrow set of low-security-risk, rarely-changing collections (lead stages, quick
# replies, custom field definitions — see lib/kvCache.ts). Every write to a cached collection
# invalidates its key, with a moderate TTL as a safety net; nothing security-sensitive (roles,
# permissions) is cached here.
[[kv_namespaces]]
binding = "CONFIG_CACHE"
id = "a5851fcc388d4092af969715947b3b7d"
